# Builds the Flutter web app and publishes it to GitHub Pages on every push
# to main (or manually from the Actions tab).
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - run: flutter pub get

      # Engine and widget tests must pass before anything is published.
      - run: flutter test

      # Project sites live under /<repository-name>/.
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # Simulation engine as a web worker, so long runs don't freeze the page.
      - name: Build simulation web worker
        run: |
          dart compile js -O2 -o build/web/sim_worker.js lib/simulation/worker/sim_worker.dart
          test -s build/web/sim_worker.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
